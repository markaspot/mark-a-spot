worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format safe_access '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_user_agent"';
    access_log /dev/stdout safe_access;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64M;
    underscores_in_headers on;

    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript application/xml text/css text/plain image/svg+xml;

    include /tmp/markaspot-trusted-real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    geo $realip_remote_addr $trusted_proxy {
        default 0;
        include /tmp/markaspot-trusted-proxy-geo.conf;
    }

    map "$trusted_proxy:$http_x_forwarded_proto" $safe_forwarded_proto {
        default $scheme;
        "1:http" http;
        "1:https" https;
    }

    map "$trusted_proxy:$safe_forwarded_proto" $safe_forwarded_port {
        default $server_port;
        "1:http" 80;
        "1:https" 443;
    }

    server {
        listen 8080;
        server_name _;
        root /app/data/web;
        index index.php index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ (^|/)\. {
            return 403;
        }

        location ~ ^/sites/[^/]+/files/.*\.php$ {
            return 403;
        }

        location ~* \.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
            return 404;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        location ~* \.(txt|log)$ {
            return 404;
        }

        location ~* (^|/)composer\.(json|lock)$ {
            return 404;
        }

        location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|tpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$ {
            return 404;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        location ~ '\.php$|^/update.php' {
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param REMOTE_ADDR 127.0.0.1;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_PORT $safe_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_PROTO $safe_forwarded_proto;
            fastcgi_read_timeout 300;
            fastcgi_pass drupal:9000;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
            try_files $uri /index.php?$query_string;
            expires 30d;
            log_not_found off;
        }

        location ~ ^/sites/.*/files/styles/ {
            try_files $uri /index.php?$query_string;
        }

        location ~ ^(/[a-z-]+)?/system/files/ {
            try_files $uri /index.php?$query_string;
        }
    }
}
